name: Windows Build

on:
  push:
    tags:
      - "windows-v*"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # only used to publish the release on windows-v* tags
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP\dotnet-install.ps1"
          & "$env:RUNNER_TEMP\dotnet-install.ps1" -Channel 10.0 -InstallDir "$env:RUNNER_TEMP\dotnet"
          "$env:RUNNER_TEMP\dotnet" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "DOTNET_ROOT=$env:RUNNER_TEMP\dotnet" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build FreeFlow.exe
        shell: pwsh
        run: dotnet publish windows/FreeFlow.Windows -c Release -o publish

      - name: Smoke test (app starts and stays running without errors)
        shell: pwsh
        run: |
          $log = Join-Path $env:APPDATA "FreeFlow\error.log"
          if (Test-Path $log) { Remove-Item $log }
          $p = Start-Process -FilePath "publish\FreeFlow.exe" -PassThru
          Start-Sleep -Seconds 15
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          if (Test-Path $log) {
            Write-Host "---- error.log ----"
            Get-Content $log
            throw "FreeFlow logged errors during startup."
          }
          if (-not $alive) { throw "FreeFlow exited during startup (exit code $($p.ExitCode))." }
          Write-Host "FreeFlow started and ran for 15s with no errors."

      - name: Checksum
        shell: pwsh
        run: (Get-FileHash publish\FreeFlow.exe -Algorithm SHA256).Hash.ToLower() | Tee-Object -FilePath publish\FreeFlow.exe.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring("windows-v".Length)
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "FreeFlow for Windows $version" --notes-file windows/RELEASE_NOTES.md
          }
          gh release upload $tag publish/FreeFlow.exe publish/FreeFlow.exe.sha256 --clobber
